[project]
name = "tandem-backend"
version = "0.1.0"
description = "Tandem: multi-agent pipeline that finds where neighboring utilities plan to build close together"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "google-genai>=1.30",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.uv]
package = false
